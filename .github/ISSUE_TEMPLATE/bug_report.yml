name: Bug report
description: Something in Autumn does not work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Autumn version
      description: Shown at the bottom right of the start screen.
      placeholder: "1.1.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Editor (nodes, links, groups)
        - Run / trace
        - Result node / Ask the AI
        - MCP server
        - Export (PDF, Markdown, PNG)
        - Build from source
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact error message if there was one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the example project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or a small project file
      description: Remove API keys, personal paths and anything private before attaching.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed keys, tokens and personal information from everything above.
          required: true
